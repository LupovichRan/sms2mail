# CI workflow for building the debug APK and running unit tests.
# It lives in docs/ because the token used to create this repo had no
# "Workflows" permission. To enable it, move it to .github/workflows/build-apk.yml.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sms2mail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
